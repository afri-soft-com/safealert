name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_deploy_web:
        description: "Force Render deploy (API + admin) even without path changes"
        required: false
        default: true
        type: boolean
      force_mobile_aab:
        description: "Force mobile AAB build + upload"
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.flags.outputs.backend }}
      frontend: ${{ steps.flags.outputs.frontend }}
      admin: ${{ steps.flags.outputs.admin }}
      deploy_web: ${{ steps.flags.outputs.deploy_web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose*.yml'
              - 'render.yaml'
            frontend:
              - 'frontend/**'
            admin:
              - 'admin-web/**'
              - 'render.yaml'
            deploy_web:
              - 'backend/**'
              - 'admin-web/**'
              - 'render.yaml'
              - '.github/workflows/**'
      - name: Resolve change flags
        id: flags
        run: |
          set -euo pipefail
          backend="${{ steps.filter.outputs.backend }}"
          frontend="${{ steps.filter.outputs.frontend }}"
          admin="${{ steps.filter.outputs.admin }}"
          deploy_web="${{ steps.filter.outputs.deploy_web }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.force_deploy_web }}" = "true" ]; then
              backend=true
              admin=true
              deploy_web=true
            fi
            if [ "${{ inputs.force_mobile_aab }}" = "true" ]; then
              frontend=true
            fi
          fi
          {
            echo "backend=${backend}"
            echo "frontend=${frontend}"
            echo "admin=${admin}"
            echo "deploy_web=${deploy_web}"
          } >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: safealert
          POSTGRES_USER: safealert
          POSTGRES_PASSWORD: safealert
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit (dependencies)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run database migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgresql://safealert:safealert@localhost:5432/safealert

      - name: Run API regression tests
        run: npm test
        env:
          DATABASE_URL: postgresql://safealert:safealert@localhost:5432/safealert
          JWT_SECRET: test-secret-minimum-32-characters-long
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:5173

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Lint and static analysis
        # Info-level lints (e.g. use_build_context_synchronously) stay visible but non-blocking.
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test

  admin-web:
    needs: changes
    if: needs.changes.outputs.admin == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          export VITE_API_BASE_URL="${API_BASE_URL:-https://safealert-api.onrender.com/api}"
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [changes, backend]
    if: |
      always() &&
      needs.changes.outputs.backend == 'true' &&
      needs.backend.result == 'success'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend Docker image (smoke, no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ghcr.io/afri-soft-com/safealert-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Dump Render Postgres before deploy (migrate runs at container start).
  # Use secrets.PROD_DATABASE_URL = External Database URL from safealert-db
  # (Internal URL is unreachable from GitHub Actions). Skip if unset.
  db-backup:
    needs: [changes, backend]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.backend == 'true' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Backup production database
        id: backup
        env:
          # Prefer PROD_DATABASE_URL = Render Postgres External Database URL
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          chmod +x scripts/db-backup.sh
          ./scripts/db-backup.sh "backups/safealert-${{ github.sha }}.sql.gz"

      - name: Upload DB backup artifact
        if: steps.backup.outputs.file != ''
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.sha }}
          path: ${{ steps.backup.outputs.file }}
          retention-days: 14
          if-no-files-found: warn

  # Déploiement web automatique Render (API + admin) via API Render
  deploy-render:
    needs: [changes, backend, admin-web, db-backup]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.deploy_web == 'true' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.admin-web.result == 'success' || needs.admin-web.result == 'skipped') &&
      (needs.db-backup.result == 'success' || needs.db-backup.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Deploy safealert-api on Render
        if: needs.changes.outputs.backend == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${SERVICE_ID:-}" ]; then
            echo "Secrets Render API manquants"
            exit 1
          fi
          # Best-effort: cancel stuck queued deploys (do not fail the job)
          mapfile -t stuck < <(curl -fsS \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/${SERVICE_ID}/deploys?limit=10" \
            | jq -r '.[] | select(.deploy.status=="queued") | .deploy.id // empty' || true)
          for old_id in "${stuck[@]:-}"; do
            [ -z "${old_id:-}" ] && continue
            echo "Annulation deploy bloqué: $old_id"
            curl -sS -X POST \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/${SERVICE_ID}/deploys/${old_id}/cancel" \
              >/dev/null || true
          done
          http_code=$(curl -sS -o /tmp/render-deploy.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"clear"}' \
            "https://api.render.com/v1/services/${SERVICE_ID}/deploys")
          echo "Render deploy HTTP ${http_code}"
          cat /tmp/render-deploy.json; echo
          deploy_id=$(jq -r '(.id // .deploy.id // empty)' /tmp/render-deploy.json)
          if [ -z "$deploy_id" ]; then
            sleep 2
            deploy_id=$(curl -fsS \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/${SERVICE_ID}/deploys?limit=1" \
              | jq -r '.[0].deploy.id // empty')
          fi
          if [ -z "$deploy_id" ]; then
            echo "Impossible de lire l'ID du deploy Render"
            exit 1
          fi
          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ] && [ "$http_code" != "202" ]; then
            echo "Deploy Render HTTP inattendu: ${http_code}"
            exit 1
          fi
          echo "DEPLOY_ID=${deploy_id}" >> "$GITHUB_ENV"
          echo "Deploy API déclenché: ${deploy_id}"

      - name: Ensure SPA rewrite on safealert-admin
        if: needs.changes.outputs.admin == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_ADMIN_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${SERVICE_ID:-}" ]; then
            echo "Secrets Render admin manquants"
            exit 1
          fi
          echo "Routes actuelles:"
          curl -fsS \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/${SERVICE_ID}/routes" \
            | jq . || true
          echo "Application rewrite SPA /* → /index.html…"
          curl -fsS -X PUT \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '[{"type":"rewrite","source":"/*","destination":"/index.html"}]' \
            "https://api.render.com/v1/services/${SERVICE_ID}/routes" \
            | jq .
          echo "Routes SPA OK"

      - name: Deploy safealert-admin on Render
        if: needs.changes.outputs.admin == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_ADMIN_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${SERVICE_ID:-}" ]; then
            echo "Secrets Render admin manquants"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"clear"}' \
            "https://api.render.com/v1/services/${SERVICE_ID}/deploys"
          echo "Deploy admin déclenché"

      - name: Wait until API deploy is live
        if: needs.changes.outputs.backend == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_ID:-}" ]; then
            echo "DEPLOY_ID manquant — fallback dernier deploy"
            DEPLOY_ID=$(curl -fsS \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/${SERVICE_ID}/deploys?limit=1" \
              | jq -r '.[0].deploy.id // empty')
          fi
          if [ -z "${DEPLOY_ID:-}" ]; then
            echo "DEPLOY_ID manquant"
            exit 1
          fi
          # ~20 min (free/starter Render often stays queued)
          for attempt in $(seq 1 80); do
            body=$(curl -fsS \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/${SERVICE_ID}/deploys/${DEPLOY_ID}" \
              || curl -fsS \
                -H "Authorization: Bearer ${RENDER_API_KEY}" \
                -H "Accept: application/json" \
                "https://api.render.com/v1/services/${SERVICE_ID}/deploys?limit=1")
            status=$(echo "$body" | jq -r '.status // .deploy.status // .[0].deploy.status // empty')
            echo "Deploy ${DEPLOY_ID} status: ${status} ($attempt/80)"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|deactivated)
                echo "Deploy Render en échec: $status"
                echo "$body" | jq . || true
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "Timeout attente deploy Render (${DEPLOY_ID})"
          exit 1

      - name: Smoke test production
        if: needs.changes.outputs.backend == 'true'
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          BASE="${PRODUCTION_URL:-https://safealert-api.onrender.com}"
          BASE="${BASE%/}"
          ok=0
          for attempt in $(seq 1 24); do
            code=$(curl -sS -o /tmp/smoke.json -w "%{http_code}" \
              --connect-timeout 10 --max-time 45 "${BASE}/health/ready" || echo "000")
            if [ "$code" = "200" ]; then
              echo "✓ /health/ready HTTP 200"
              cat /tmp/smoke.json; echo
              ok=1
              break
            fi
            echo "… HTTP $code ($attempt/24)"
            sleep 10
          done
          test "$ok" -eq 1

  # AAB rebuild + upload artifact + GitHub Release (si frontend changé)
  mobile-aab:
    needs: [changes, frontend]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.frontend == 'true' &&
      needs.frontend.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Play Store keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEY_PROPERTIES:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            printf '%s\n' "$ANDROID_KEY_PROPERTIES" > android/key.properties
            echo "Keystore Play Store chargé."
          else
            echo "Pas de keystore secrets — AAB debug-signed (tests internes)."
          fi

      - name: Build App Bundle
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          BASE="${API_BASE_URL:-https://safealert-api.onrender.com/api}"
          flutter build appbundle --release --dart-define=API_BASE_URL="$BASE"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: safealert-aab-${{ github.sha }}
          path: frontend/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publish AAB on GitHub Release (rolling tag aab-main)
        uses: ncipollo/release-action@v1
        with:
          tag: aab-main
          name: SafeAlert AAB (main)
          body: |
            AAB rebuild automatique depuis `main` (`${{ github.sha }}`).
            API: `${{ vars.API_BASE_URL }}`
          artifacts: frontend/build/app/outputs/bundle/release/app-release.aab
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true
          commit: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Google Play internal track (optional)
        if: ${{ env.PLAY_JSON != '' }}
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.safealert.safealert
          releaseFiles: frontend/build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          # Play refuse le commit tant que la déclaration Foreground Service
          # n'est pas remplie dans la Console (Policy → App content).
          changesNotSentForReview: true
