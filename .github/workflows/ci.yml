name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      admin: ${{ steps.filter.outputs.admin }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose*.yml'
              - 'render.yaml'
            frontend:
              - 'frontend/**'
            admin:
              - 'admin-web/**'
              - 'render.yaml'
            deploy:
              - 'backend/**'
              - 'admin-web/**'
              - 'render.yaml'
              - '.github/workflows/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: safealert
          POSTGRES_USER: safealert
          POSTGRES_PASSWORD: safealert
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit (dependencies)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run database migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgresql://safealert:safealert@localhost:5432/safealert

      - name: Run API regression tests
        run: npm test
        env:
          DATABASE_URL: postgresql://safealert:safealert@localhost:5432/safealert
          JWT_SECRET: test-secret-minimum-32-characters-long
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:5173

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Lint and static analysis
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

  admin-web:
    needs: changes
    if: needs.changes.outputs.admin == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: https://ci-placeholder.example.com/api

  docker-build:
    runs-on: ubuntu-latest
    needs: [changes, backend]
    if: |
      always() &&
      needs.changes.outputs.backend == 'true' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image (smoke, no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ghcr.io/afri-soft-com/safealert-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Déploiement Render (API + admin) — hooks dashboard Render
  deploy-render:
    needs: [changes, backend, admin-web, docker-build]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.changes.outputs.deploy == 'true' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.admin-web.result == 'success' || needs.admin-web.result == 'skipped') &&
      (needs.docker-build.result == 'success' || needs.docker-build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Render API deploy hook
        if: needs.changes.outputs.backend == 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "RENDER_DEPLOY_HOOK_API non configuré — auto-deploy Git Render éventuel."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Déploiement Render safealert-api déclenché."

      - name: Trigger Render admin static deploy hook
        if: needs.changes.outputs.admin == 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_ADMIN }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "RENDER_DEPLOY_HOOK_ADMIN non configuré — auto-deploy Git Render éventuel."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          echo "Déploiement Render safealert-admin déclenché."

      - name: Smoke test production (Render)
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_URL:-}" ]; then
            echo "PRODUCTION_URL non configuré — smoke ignoré."
            exit 0
          fi
          BASE="${PRODUCTION_URL%/}"
          echo "Attente cold start Render puis smoke sur ${BASE}"
          ok=0
          for attempt in $(seq 1 18); do
            code=$(curl -sS -o /tmp/smoke.json -w "%{http_code}" \
              --connect-timeout 10 --max-time 30 "${BASE}/health/ready" || echo "000")
            if [ "$code" = "200" ]; then
              echo "✓ /health/ready HTTP 200 (tentative $attempt)"
              cat /tmp/smoke.json; echo
              ok=1
              break
            fi
            echo "… HTTP $code ($attempt/18) — cold start possible"
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "Échec smoke /health/ready"
            exit 1
          fi

  # AAB pour Play Store (signature debug en CI ; keystore store via secrets optionnels)
  mobile-aab:
    needs: [changes, frontend]
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (needs.changes.outputs.frontend == 'true' || startsWith(github.ref, 'refs/tags/v')) &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Play Store keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEY_PROPERTIES:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            printf '%s\n' "$ANDROID_KEY_PROPERTIES" > android/key.properties
            echo "Keystore Play Store chargé."
          else
            echo "Pas de secrets keystore — AAB signé debug (internal testing OK, pas prod store)."
          fi

      - name: Build App Bundle (Play Store)
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          BASE="${API_BASE_URL:-https://safealert-api.onrender.com/api}"
          flutter build appbundle --release --dart-define=API_BASE_URL="$BASE"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: safealert-aab-${{ github.sha }}
          path: frontend/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
