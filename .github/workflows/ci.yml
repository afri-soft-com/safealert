name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: safealert
          POSTGRES_USER: safealert
          POSTGRES_PASSWORD: safealert
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit (dependencies)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run database migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgresql://safealert:safealert@localhost:5432/safealert

      - name: Run API regression tests
        run: npm test
        env:
          DATABASE_URL: postgresql://safealert:safealert@localhost:5432/safealert
          JWT_SECRET: test-secret-minimum-32-characters-long
          NODE_ENV: test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Lint and static analysis
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image (smoke test, tag GHCR)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: |
            ghcr.io/afri-soft-com/safealert-api:ci
            ghcr.io/afri-soft-com/safealert-api:${{ github.sha }}
