name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      admin: ${{ steps.filter.outputs.admin }}
      deploy_web: ${{ steps.filter.outputs.deploy_web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose*.yml'
              - 'render.yaml'
            frontend:
              - 'frontend/**'
            admin:
              - 'admin-web/**'
              - 'render.yaml'
            deploy_web:
              - 'backend/**'
              - 'admin-web/**'
              - 'render.yaml'
              - '.github/workflows/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: safealert
          POSTGRES_USER: safealert
          POSTGRES_PASSWORD: safealert
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit (dependencies)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run database migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgresql://safealert:safealert@localhost:5432/safealert

      - name: Run API regression tests
        run: npm test
        env:
          DATABASE_URL: postgresql://safealert:safealert@localhost:5432/safealert
          JWT_SECRET: test-secret-minimum-32-characters-long
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:5173

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Lint and static analysis
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

  admin-web:
    needs: changes
    if: needs.changes.outputs.admin == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          export VITE_API_BASE_URL="${API_BASE_URL:-https://safealert-api.onrender.com/api}"
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [changes, backend]
    if: |
      always() &&
      needs.changes.outputs.backend == 'true' &&
      needs.backend.result == 'success'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend Docker image (smoke, no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ghcr.io/afri-soft-com/safealert-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Déploiement web automatique Render (API + admin) via API Render
  deploy-render:
    needs: [changes, backend, admin-web]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.changes.outputs.deploy_web == 'true' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.admin-web.result == 'success' || needs.admin-web.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy safealert-api on Render
        if: needs.changes.outputs.backend == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${SERVICE_ID:-}" ]; then
            echo "Secrets Render API manquants"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"clear"}' \
            "https://api.render.com/v1/services/${SERVICE_ID}/deploys"
          echo "Deploy API déclenché"

      - name: Deploy safealert-admin on Render
        if: needs.changes.outputs.admin == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_ADMIN_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${SERVICE_ID:-}" ]; then
            echo "Secrets Render admin manquants"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"clear"}' \
            "https://api.render.com/v1/services/${SERVICE_ID}/deploys"
          echo "Deploy admin déclenché"

      - name: Wait until API deploy is live
        if: needs.changes.outputs.backend == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            status=$(curl -fsS \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/${SERVICE_ID}/deploys?limit=1" \
              | jq -r '.[0].deploy.status // empty')
            echo "Deploy status: ${status} ($attempt/36)"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|deactivated)
                echo "Deploy Render en échec: $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timeout attente deploy Render"
          exit 1

      - name: Smoke test production
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          BASE="${PRODUCTION_URL:-https://safealert-api.onrender.com}"
          BASE="${BASE%/}"
          ok=0
          for attempt in $(seq 1 18); do
            code=$(curl -sS -o /tmp/smoke.json -w "%{http_code}" \
              --connect-timeout 10 --max-time 45 "${BASE}/health/ready" || echo "000")
            if [ "$code" = "200" ]; then
              echo "✓ /health/ready HTTP 200"
              cat /tmp/smoke.json; echo
              ok=1
              break
            fi
            echo "… HTTP $code ($attempt/18)"
            sleep 10
          done
          test "$ok" -eq 1

  # AAB rebuild + upload artifact + GitHub Release (si frontend changé)
  mobile-aab:
    needs: [changes, frontend]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Play Store keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEY_PROPERTIES:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            printf '%s\n' "$ANDROID_KEY_PROPERTIES" > android/key.properties
            echo "Keystore Play Store chargé."
          else
            echo "Pas de keystore secrets — AAB debug-signed (tests internes)."
          fi

      - name: Build App Bundle
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          BASE="${API_BASE_URL:-https://safealert-api.onrender.com/api}"
          flutter build appbundle --release --dart-define=API_BASE_URL="$BASE"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: safealert-aab-${{ github.sha }}
          path: frontend/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Publish AAB on GitHub Release (rolling tag aab-main)
        uses: ncipollo/release-action@v1
        with:
          tag: aab-main
          name: SafeAlert AAB (main)
          body: |
            AAB rebuild automatique depuis `main` (`${{ github.sha }}`).
            API: `${{ vars.API_BASE_URL }}`
          artifacts: frontend/build/app/outputs/bundle/release/app-release.aab
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true
          commit: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Google Play internal track (optional)
        if: ${{ env.PLAY_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.safealert.safealert
          releaseFiles: frontend/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
