# Restore / set individual Render env keys (never full PUT - secrets get blanked).
name: Restore Render env keys

on:
  workflow_dispatch:
    inputs:
      restore_jwt:
        description: Restore JWT_SECRET from GitHub secret
        type: boolean
        default: true
      app_latest_version:
        description: APP_LATEST_VERSION
        required: true
        default: "1.0.65"
      admin_web_version:
        description: ADMIN_WEB_VERSION
        required: true
        default: "1.0.16"
      apple_client_ids:
        description: APPLE_CLIENT_IDS (bundle IDs, comma-separated)
        required: true
        default: "com.kakiranya.safealert"
      google_client_id:
        description: Web GOOGLE_CLIENT_ID
        required: true
        default: "552870535150-8i0ki30r45bipf8ren9ajtfp5bt5ipkr.apps.googleusercontent.com"
      google_android_client_id:
        description: Comma-separated Android OAuth client IDs
        required: true
        default: "552870535150-358uiarfelvoefjndn31f18d22fi6edd.apps.googleusercontent.com,552870535150-4d04armu8m10puutgru836q8k2e5o5eg.apps.googleusercontent.com,552870535150-j1g4ma59rmdgtn48hqh95p2ru5bvi0qf.apps.googleusercontent.com"
      redeploy:
        type: boolean
        default: true

jobs:
  restore-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: PUT individual env keys (safe)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESTORE_JWT: ${{ inputs.restore_jwt }}
          APP_LATEST_VERSION: ${{ inputs.app_latest_version }}
          APP_LATEST_BUILD: "93"
          ADMIN_WEB_VERSION: ${{ inputs.admin_web_version }}
          APPLE_CLIENT_IDS: ${{ inputs.apple_client_ids }}
          GOOGLE_CLIENT_ID: ${{ inputs.google_client_id }}
          GOOGLE_ANDROID_CLIENT_ID: ${{ inputs.google_android_client_id }}
          AFRISOFT_PAY_HUB_API_KEY: ${{ secrets.AFRISOFT_PAY_HUB_API_KEY }}
          AFRISOFT_PAY_HUB_WEBHOOK_SECRET: ${{ secrets.AFRISOFT_PAY_HUB_WEBHOOK_SECRET }}
          AFRISOFT_HUB_APP_ID: ${{ secrets.AFRISOFT_HUB_APP_ID }}
          AFRISOFT_HUB_API_KEY: ${{ secrets.AFRISOFT_HUB_API_KEY }}
          AFRISOFT_SMS_HUB_URL: ${{ secrets.AFRISOFT_SMS_HUB_URL }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_CLIENT_EMAIL: ${{ secrets.FCM_CLIENT_EMAIL }}
          FCM_PRIVATE_KEY: ${{ secrets.FCM_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          put_key() {
            local key="$1"
            export VAL="$2"
            local code
            local body
            body=$(python3 -c 'import json,os; print(json.dumps({"value": os.environ["VAL"]}))')
            code=$(curl -sS -o /tmp/put-one.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d "$body" \
              "https://api.render.com/v1/services/${SERVICE_ID}/env-vars/${key}")
            echo "PUT ${key} HTTP ${code} (len=${#VAL})"
            head -c 240 /tmp/put-one.json; echo
            case "$code" in 200|201) ;; *) exit 1 ;; esac
          }
          if [ "${RESTORE_JWT}" = "true" ]; then
            if [ -z "${JWT_SECRET:-}" ] || [ "${#JWT_SECRET}" -lt 32 ]; then
              echo "JWT_SECRET GitHub secret missing or too short"
              exit 1
            fi
            put_key JWT_SECRET "$JWT_SECRET"
          fi
          put_key APP_LATEST_VERSION "$APP_LATEST_VERSION"
          put_key APP_LATEST_BUILD "${APP_LATEST_BUILD:-93}"
          put_key ADMIN_WEB_VERSION "$ADMIN_WEB_VERSION"
          put_key APPLE_CLIENT_IDS "$APPLE_CLIENT_IDS"
          put_key GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          put_key GOOGLE_ANDROID_CLIENT_ID "$GOOGLE_ANDROID_CLIENT_ID"

          # AfriSoft pay hub (Mobile Money)
          put_key AFRISOFT_PAY_HUB_URL "https://pay.afri-soft.com"
          put_key AFRISOFT_PAY_HUB_APP_ID "safealert"
          put_key FEATURE_PREMIUM "true"
          put_key USD_TO_CDF_RATE "2850"
          if [ -n "${AFRISOFT_PAY_HUB_API_KEY:-}" ]; then
            put_key AFRISOFT_PAY_HUB_API_KEY "$AFRISOFT_PAY_HUB_API_KEY"
            put_key AFRISOFT_PAY_HUB_WEBHOOK_SECRET "${AFRISOFT_PAY_HUB_WEBHOOK_SECRET:-$AFRISOFT_PAY_HUB_API_KEY}"
            # SMS hub often shares the same AfriSoft credentials (OTP + group SOS SMS).
            put_key AFRISOFT_HUB_APP_ID "${AFRISOFT_HUB_APP_ID:-safealert}"
            put_key AFRISOFT_HUB_API_KEY "${AFRISOFT_HUB_API_KEY:-$AFRISOFT_PAY_HUB_API_KEY}"
            put_key AFRISOFT_SMS_HUB_URL "${AFRISOFT_SMS_HUB_URL:-https://sms.afri-soft.com}"
          else
            echo "WARN: AFRISOFT_PAY_HUB_API_KEY GitHub secret missing - hub keys not updated"
          fi

          # Firebase Cloud Messaging (optional — without these, SOS push is silent)
          if [ -n "${FCM_PROJECT_ID:-}" ] && [ -n "${FCM_CLIENT_EMAIL:-}" ] && [ -n "${FCM_PRIVATE_KEY:-}" ]; then
            put_key FCM_PROJECT_ID "$FCM_PROJECT_ID"
            put_key FCM_CLIENT_EMAIL "$FCM_CLIENT_EMAIL"
            put_key FCM_PRIVATE_KEY "$FCM_PRIVATE_KEY"
          else
            echo "WARN: FCM_* GitHub secrets missing — SOS push will stay disabled until set (see docs/FIREBASE_SETUP.md)"
          fi

      - name: List env keys (names only)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
        run: |
          curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" \
            "https://api.render.com/v1/services/${SERVICE_ID}/env-vars" \
            | python3 -c 'import json,sys; raw=json.load(sys.stdin)
          for row in raw:
            ev=row.get("envVar",row)
            print(ev.get("key"), "secret="+str(bool(ev.get("value") in (None,""))))'

      - name: Redeploy API
        if: inputs.redeploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/deploy.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/${SERVICE_ID}/deploys")
          echo "Deploy HTTP ${code}"
          cat /tmp/deploy.json; echo
          case "$code" in 200|201|202) ;; *) exit 1 ;; esac
          deploy_id=$(python3 -c "import json; from pathlib import Path; raw=Path('/tmp/deploy.json').read_text().strip(); d=json.loads(raw) if raw else {}; print(d.get('id') or d.get('deploy',{}).get('id') or '')")
          if [ -z "$deploy_id" ]; then
            deploy_id=$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" \
              "https://api.render.com/v1/services/${SERVICE_ID}/deploys?limit=1" \
              | python3 -c "import json,sys; rows=json.load(sys.stdin); d=rows[0] if isinstance(rows,list) and rows else {}; print((d.get('deploy') or d).get('id') or '')")
          fi
          echo "deploy_id=$deploy_id"
          if [ -z "$deploy_id" ]; then
            echo "Could not resolve deploy id after HTTP ${code}"
            exit 1
          fi
          # Env keys already applied above; redeploy can take >10m on Render.
          for i in $(seq 1 90); do
            st=$(curl -fsS -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" \
              "https://api.render.com/v1/services/${SERVICE_ID}/deploys/${deploy_id}" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status") or d.get("deploy",{}).get("status") or "")')
            echo "status=$st"
            case "$st" in
              live) exit 0 ;;
              update_failed|build_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 10
          done
          echo "::warning::Redeploy still in progress after ~15m — env keys were saved; CI deploy may already be live."
          exit 0
