name: Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Run deploy step after build (requires SSH secrets)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: afri-soft-com/safealert-api

jobs:
  test-and-migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: safealert
          POSTGRES_USER: safealert
          POSTGRES_PASSWORD: safealert
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Validate migrations (pre-deploy)
        run: npm run migrate
        env:
          DATABASE_URL: postgresql://safealert:safealert@localhost:5432/safealert

      - name: Regression tests
        run: npm test
        env:
          DATABASE_URL: postgresql://safealert:safealert@localhost:5432/safealert
          JWT_SECRET: test-secret-minimum-32-characters-long
          NODE_ENV: test

  build-and-push:
    needs: test-and-migrate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        name: Docker image metadata
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "${IMAGE}:${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH (Neon + Redis sur VPS)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH || '/opt/safealert' }}"
            COMPOSE_FILE="${{ secrets.COMPOSE_FILE || 'docker-compose.neon.yml' }}"
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            cd "$DEPLOY_PATH"
            set -a
            source .env.production
            set +a
            export API_IMAGE="$IMAGE"
            docker compose -f "$COMPOSE_FILE" --env-file .env.production pull api
            docker compose -f "$COMPOSE_FILE" --env-file .env.production up -d redis
            MIGRATE_URL="${DATABASE_URL_DIRECT:-$DATABASE_URL}"
            docker compose -f "$COMPOSE_FILE" --env-file .env.production run --rm \
              -e DATABASE_URL="$MIGRATE_URL" \
              api npm run migrate
            docker compose -f "$COMPOSE_FILE" --env-file .env.production up -d api
            docker compose -f "$COMPOSE_FILE" --env-file .env.production exec -T api node -e \
              "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"

  mobile-aab:
    needs: test-and-migrate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode Play Store keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEY_PROPERTIES:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            printf '%s\n' "$ANDROID_KEY_PROPERTIES" > android/key.properties
            echo "Keystore Play Store chargé."
          else
            echo "Pas de secrets keystore — AAB signé debug."
          fi

      - name: Build App Bundle (Play Store)
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          BASE="${API_BASE_URL:-https://safealert-api.onrender.com/api}"
          flutter build appbundle --release --dart-define=API_BASE_URL="$BASE"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: safealert-aab-${{ github.ref_name }}
          path: frontend/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  smoke-production:
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build-and-push.result == 'success' &&
      (needs.deploy.result == 'success' ||
       (needs.deploy.result == 'skipped' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    steps:
      - name: Smoke test — endpoints de production
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          if [ -z "${PRODUCTION_URL:-}" ]; then
            echo "PRODUCTION_URL non configuré — smoke test ignoré."
            exit 0
          fi
          BASE="${PRODUCTION_URL%/}"
          echo "→ Vérification de ${BASE}"
          for path in /health /health/ready; do
            echo "  GET ${path}"
            ok=0
            for attempt in $(seq 1 12); do
              code=$(curl -sS -o /tmp/smoke-body.json -w "%{http_code}" \
                --connect-timeout 10 --max-time 30 "${BASE}${path}" || echo "000")
              if [ "$code" = "200" ]; then
                echo "    ✓ HTTP $code (tentative $attempt)"
                cat /tmp/smoke-body.json
                echo ""
                ok=1
                break
              fi
              echo "    … HTTP $code (tentative $attempt/12)"
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then
              echo "Échec smoke test sur ${path}"
              cat /tmp/smoke-body.json 2>/dev/null || true
              exit 1
            fi
          done
          echo "→ Vérification légère API (sans auth)"
          code=$(curl -sS -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 --max-time 30 "${BASE}/api/map/incidents" || echo "000")
          if [ "$code" != "200" ] && [ "$code" != "401" ]; then
            echo "Réponse inattendue /api/map/incidents : HTTP $code"
            exit 1
          fi
          echo "    ✓ /api/map/incidents HTTP $code"
          echo "Smoke tests production OK."
