# SafeAlert iOS — build IPA on GitHub (macOS) + optional TestFlight upload
name: Mobile iOS

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Upload IPA to TestFlight after build"
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/mobile-ios.yml"

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  mobile-ipa:
    # Skip automatic push builds unless Apple signing secrets exist (manual dispatch always runs).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-14
    timeout-minutes: 75
    defaults:
      run:
        working-directory: frontend
    env:
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Require Apple signing secrets
        run: |
          set -euo pipefail
          missing=0
          for v in IOS_TEAM_ID BUILD_CERTIFICATE_BASE64 IOS_P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing secret $v — see docs/IOS_APP_STORE.md"
              missing=1
            fi
          done
          exit "$missing"
        working-directory: .

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.6
          cache: true

      - name: Install CocoaPods
        run: |
          set -euo pipefail
          gem install cocoapods --no-document
          flutter pub get
          cd ios && pod install --repo-update

      - name: Import certificate and provisioning profile
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD || 'safealert-ci-temp' }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PP_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          PP_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PP_UUID.mobileprovision"
          echo "PROVISION_NAME=$PP_NAME" >> "$GITHUB_ENV"
          echo "Installed profile: $PP_NAME ($PP_UUID)"

      - name: Patch export options + push entitlement for release
        run: |
          set -euo pipefail
          # Production APNs for TestFlight / App Store
          /usr/libexec/PlistBuddy -c "Set :aps-environment production" ios/Runner/Runner.entitlements || \
            /usr/libexec/PlistBuddy -c "Add :aps-environment string production" ios/Runner/Runner.entitlements

          # Fill team + profile name in ExportOptions
          sed -i '' "s/\$(IOS_TEAM_ID)/${IOS_TEAM_ID}/g" ios/ExportOptions.plist
          sed -i '' "s/\$(IOS_PROVISION_PROFILE_NAME)/${PROVISION_NAME}/g" ios/ExportOptions.plist
          # Escape XML if profile name has special chars — basic quote fix
          plutil -convert xml1 ios/ExportOptions.plist

      - name: Configure Xcode signing (manual)
        run: |
          set -euo pipefail
          PBX=ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBX"
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Distribution";/g' "$PBX"
          if ! grep -q "DEVELOPMENT_TEAM = ${IOS_TEAM_ID};" "$PBX"; then
            sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = com.kakiranya.safealert;/PRODUCT_BUNDLE_IDENTIFIER = com.kakiranya.safealert;\n\t\t\t\tDEVELOPMENT_TEAM = ${IOS_TEAM_ID};/g" "$PBX"
          fi
          # Write Release.xcconfig overrides for CI signing
          cat > ios/Flutter/Release-CI.xcconfig <<EOF
          #include "Release.xcconfig"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY=iPhone Distribution
          DEVELOPMENT_TEAM=${IOS_TEAM_ID}
          PROVISIONING_PROFILE_SPECIFIER=${PROVISION_NAME}
          EOF
          # Point project Release configs at Release-CI.xcconfig if using standard Flutter layout
          echo "PROVISION_NAME=${PROVISION_NAME}"
          echo "TEAM=${IOS_TEAM_ID}"
          grep -E "CODE_SIGN_STYLE|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY" "$PBX" | head -30

      - name: Build IPA
        timeout-minutes: 45
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          set -euo pipefail
          BASE="${API_BASE_URL:-https://safealert-api.onrender.com/api}"
          GOOGLE_ID="${GOOGLE_SERVER_CLIENT_ID:-}"
          # Archive with explicit manual Distribution signing (App Store profile)
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define=API_BASE_URL="$BASE" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_ID" \
            -- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${IOS_TEAM_ID}" \
            PROVISIONING_PROFILE_SPECIFIER="${PROVISION_NAME}" \
            CODE_SIGN_IDENTITY="iPhone Distribution"
          ls -la build/ios/ipa/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: safealert-ipa-${{ github.sha }}
          path: frontend/build/ios/ipa/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Publish IPA on GitHub Release (rolling tag ipa-main)
        uses: ncipollo/release-action@v1
        with:
          tag: ipa-main
          name: SafeAlert IPA (main)
          body: |
            IPA rebuild automatique depuis `main` (`${{ github.sha }}`).
            API: `${{ vars.API_BASE_URL }}`
            Upload TestFlight: voir job logs.
          artifacts: frontend/build/ios/ipa/*.ipa
          allowUpdates: true
          replacesArtifacts: true
          prerelease: true
          commit: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to TestFlight
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.upload_testflight == true)
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_ID:-}" ] || [ -z "${ASC_ISSUER_ID:-}" ] || [ -z "${ASC_KEY_BASE64:-}" ]; then
            echo "App Store Connect API key secrets missing — IPA built but not uploaded to TestFlight."
            echo "Set APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_API_KEY_BASE64."
            exit 0
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo -n "$ASC_KEY_BASE64" | base64 --decode -o "$KEY_PATH"
          IPA=$(ls -1 build/ios/ipa/*.ipa | head -n1)
          echo "Uploading $IPA to TestFlight…"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
