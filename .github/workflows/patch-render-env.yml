# DANGEROUS: do not use full env-vars PUT (blanks secret values from GET).
# Prefer restore-render-env.yml (per-key PUT) instead.
name: Patch Render env (single keys) — DISABLED

on:
  workflow_dispatch:
    inputs:
      notice:
        description: "Use workflow Restore Render env keys instead"
        required: false
        default: "disabled"

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Abort — full PUT wiped secrets
        run: |
          echo "::error::This workflow used PUT /env-vars (full replace) and can blank secrets."
          echo "Use 'Restore Render env keys' which PUTs one key at a time."
          exit 1
