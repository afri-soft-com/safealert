# SafeAlert — Blueprint Render (API + Redis optionnel + admin-web optionnel)
# Documentation : docs/RENDER_DEPLOY.md
# PostgreSQL : Neon (externe) — pas de Postgres sur Render
# Alternative au déploiement VPS SSH (.github/workflows/deploy.yml)

services:
  # Cache alertes actives (optionnel — l'API démarre sans Redis)
  - type: keyvalue
    name: safealert-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: safealert-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: frankfurt
    healthCheckPath: /health/ready
    preDeployCommand: sh -c 'DATABASE_URL="${DATABASE_URL_DIRECT:-$DATABASE_URL}" npm run migrate'
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: safealert-redis
          property: connectionString
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_PRIVATE_KEY
        sync: false
      - key: FCM_CLIENT_EMAIL
        sync: false

  # Console admin plateforme (Static Site — voir docs/RENDER_DEPLOY.md)
  - type: web
    name: safealert-admin
    runtime: static
    rootDir: admin-web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - admin-web/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Ex. https://safealert-api.onrender.com/api — à renseigner au 1er déploiement
      - key: VITE_API_BASE_URL
        sync: false
