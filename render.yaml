# SafeAlert — Blueprint Render (API + Postgres + Redis + admin-web)
# Documentation : docs/RENDER_DEPLOY.md

databases:
  - name: safealert-db
    plan: basic_256mb
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: safealert
    user: safealert

services:
  - type: keyvalue
    name: safealert-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: safealert-api
    runtime: node
    rootDir: backend
    plan: starter
    region: frankfurt
    healthCheckPath: /health/ready
    buildCommand: npm ci
    startCommand: npm run migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: safealert-db
          property: connectionString
      - key: DATABASE_URL_DIRECT
        fromDatabase:
          name: safealert-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        sync: false
      - key: PLATFORM_ADMIN_PHONE
        sync: false
      - key: NOMINATIM_USER_AGENT
        sync: false
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "30000"
      - key: FEATURE_SOCKET_REDIS_ADAPTER
        value: "true"
      - key: FEATURE_AUDIT_LOG
        value: "true"
      - key: FEATURE_OTP_PHONE_LIMIT
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: safealert-redis
          property: connectionString
      - key: SMS_PROVIDER
        value: auto
      - key: AFRISOFT_SMS_HUB_URL
        value: https://sms.afri-soft.com
      - key: AFRISOFT_HUB_APP_ID
        value: afrisoft-partenaire
      - key: AFRISOFT_HUB_API_KEY
        sync: false
      - key: SERDIPAY_API_KEY
        sync: false
      - key: SERDIPAY_SMS_URL
        sync: false
      - key: SERDIPAY_SENDER_ID
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_PRIVATE_KEY
        sync: false
      - key: FCM_CLIENT_EMAIL
        sync: false
      # Align with frontend/pubspec.yaml (version name) after each Play upload
      - key: APP_LATEST_VERSION
        value: "1.0.9"
      # Align with admin-web/package.json
      - key: ADMIN_WEB_VERSION
        value: "1.0.3"
      - key: ADMIN_WEB_URL
        value: "https://safealert-admin.onrender.com"

  - type: web
    name: safealert-admin
    runtime: static
    rootDir: admin-web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - admin-web/**
    # SPA fallback (obligatoire pour /annuaire, /ops, etc. en accès direct / refresh).
    # Le fichier public/_redirects n'est PAS honoré par le CDN Render — routes Blueprint/API uniquement.
    routes:
      - type: rewrite
        source: /cgu
        destination: /cgu.html
      - type: rewrite
        source: /manuel
        destination: /manuel.html
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://safealert-api.onrender.com/api
