<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Suivre un SOS — SafeAlert</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --teal: #0B6E6E; --bg: #f4f7f7; --ink: #123; --red: #CC1C1C; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, Segoe UI, sans-serif; background: var(--bg); color: var(--ink); }
    header { background: linear-gradient(135deg, #CC1C1C, #a01515); color: #fff; padding: 16px 20px; }
    header h1 { margin: 0; font-size: 1.25rem; }
    header p { margin: 6px 0 0; opacity: 0.9; font-size: 0.9rem; }
    #status { padding: 12px 20px; background: #fff; border-bottom: 1px solid #dde; font-size: 0.95rem; }
    #map { height: calc(100vh - 140px); min-height: 320px; }
    .err { color: #b00020; padding: 24px; }
    .pill { display: inline-block; background: rgba(255,255,255,0.2); padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1>SafeAlert</h1>
    <p>Suivi SOS live <span class="pill">lecture seule</span></p>
  </header>
  <div id="status">Chargement…</div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (function () {
      const token = location.pathname.split("/").filter(Boolean).pop();
      const statusEl = document.getElementById("status");
      let map, marker;

      function setStatus(html) { statusEl.innerHTML = html; }

      async function load() {
        try {
          const res = await fetch("/api/public/sos/" + encodeURIComponent(token));
          const data = await res.json();
          if (!res.ok) {
            setStatus('<span class="err">' + (data.error || "Lien invalide") + "</span>");
            return;
          }
          const t = data.incident;
          const lat = t.lat;
          const lng = t.lng;
          const bat = t.battery != null ? (" · Batterie " + t.battery + "%") : "";
          setStatus(
            "<strong>" + (t.reporter_pseudo || "Citoyen") + "</strong> · " +
            (t.zone_name || "Position") +
            " · Statut : " + (t.status || "—") + bat
          );

          if (!map) {
            map = L.map("map").setView([lat, lng], 15);
            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
              attribution: "&copy; OpenStreetMap",
            }).addTo(map);
            marker = L.marker([lat, lng]).addTo(map).bindPopup("Position SOS");
          } else {
            marker.setLatLng([lat, lng]);
            map.panTo([lat, lng]);
          }
        } catch (e) {
          setStatus('<span class="err">Impossible de charger l\'alerte.</span>');
        }
      }

      load();
      setInterval(load, 10000);
    })();
  </script>
</body>
</html>
