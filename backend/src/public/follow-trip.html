<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Suivre un trajet — SafeAlert</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --teal: #0B6E6E; --bg: #f4f7f7; --ink: #123; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, Segoe UI, sans-serif; background: var(--bg); color: var(--ink); }
    header { background: linear-gradient(135deg, #0B6E6E, #0a8a8a); color: #fff; padding: 16px 20px; }
    header h1 { margin: 0; font-size: 1.25rem; letter-spacing: 0.02em; }
    header p { margin: 6px 0 0; opacity: 0.9; font-size: 0.9rem; }
    #status { padding: 12px 20px; background: #fff; border-bottom: 1px solid #dde; font-size: 0.95rem; }
    #map { height: calc(100vh - 140px); min-height: 320px; }
    .err { color: #b00020; padding: 24px; }
    .pill { display: inline-block; background: rgba(255,255,255,0.2); padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1>SafeAlert</h1>
    <p>Suivi de trajet <span class="pill">lecture seule</span></p>
  </header>
  <div id="status">Chargement…</div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (function () {
      const token = location.pathname.split("/").filter(Boolean).pop();
      const statusEl = document.getElementById("status");
      let map, marker, destMarker, originMarker, trailLine;

      function setStatus(html) { statusEl.innerHTML = html; }

      function trackLatLngs(t) {
        const pts = [];
        if (Array.isArray(t.track)) {
          t.track.forEach(function (p) {
            if (p && p.lat != null && p.lng != null) pts.push([p.lat, p.lng]);
          });
        }
        if (!pts.length && t.origin_lat != null) {
          pts.push([t.origin_lat, t.origin_lng]);
        }
        const lat = t.last_lat ?? t.origin_lat;
        const lng = t.last_lng ?? t.origin_lng;
        if (lat != null && lng != null) {
          const last = pts[pts.length - 1];
          if (!last || last[0] !== lat || last[1] !== lng) pts.push([lat, lng]);
        }
        return pts;
      }

      async function load() {
        try {
          const res = await fetch("/api/public/trips/" + encodeURIComponent(token) + "?t=" + Date.now());
          const data = await res.json();
          if (!res.ok) {
            setStatus('<span class="err">' + (data.error || "Lien invalide") + "</span>");
            return;
          }
          const t = data.trip;
          const lat = t.last_lat ?? t.origin_lat;
          const lng = t.last_lng ?? t.origin_lng;
          const fmt = function (iso) {
            if (!iso) return "—";
            try { return new Date(iso).toLocaleString("fr-FR"); } catch (e) { return iso; }
          };
          const depart = fmt(t.created_at);
          const arrive = t.arrived_at ? fmt(t.arrived_at) : fmt(t.eta_at);
          const arriveLabel = t.arrived_at ? "Arrivée" : "Arrivée prévue";
          const nPts = Array.isArray(t.track) ? t.track.length : 0;
          setStatus(
            "<strong>" + (t.traveler_pseudo || "Voyageur") + "</strong> · " +
            (t.dest_label || "Destination") +
            " · Statut : " + (t.status || "—") +
            " · Départ : " + depart +
            " · " + arriveLabel + " : " + arrive +
            (nPts > 1 ? " · Tracé : " + nPts + " pts" : "")
          );

          const trail = trackLatLngs(t);

          if (!map) {
            map = L.map("map").setView([lat, lng], 15);
            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
              attribution: "&copy; OpenStreetMap",
            }).addTo(map);
            if (t.origin_lat != null) {
              originMarker = L.marker([t.origin_lat, t.origin_lng], { title: "Départ" })
                .addTo(map).bindPopup("<strong>Départ</strong><br/>" + depart);
            }
            marker = L.marker([lat, lng]).addTo(map).bindPopup("Position actuelle");
            if (t.trip_mode !== "patrol" && t.dest_lat != null) {
              destMarker = L.marker([t.dest_lat, t.dest_lng], { title: "Destination" })
                .addTo(map).bindPopup(
                  "<strong>" + arriveLabel + "</strong><br/>" + arrive +
                  (t.dest_label ? "<br/>" + t.dest_label : "")
                );
            }
            trailLine = L.polyline(trail.length ? trail : [[lat, lng]], {
              color: "#0B6E6E", weight: 4, opacity: 0.9,
            }).addTo(map);
          } else {
            marker.setLatLng([lat, lng]);
            if (trailLine) trailLine.setLatLngs(trail.length ? trail : [[lat, lng]]);
            map.panTo([lat, lng]);
          }
        } catch (e) {
          setStatus('<span class="err">Impossible de charger le trajet.</span>');
        }
      }

      load();
      setInterval(load, 5000);
    })();
  </script>
</body>
</html>
