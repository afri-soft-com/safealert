<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Suivre un trajet — SafeAlert</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --teal: #0B6E6E; --bg: #f4f7f7; --ink: #123; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, Segoe UI, sans-serif; background: var(--bg); color: var(--ink); }
    header { background: linear-gradient(135deg, #0B6E6E, #0a8a8a); color: #fff; padding: 16px 20px; }
    header h1 { margin: 0; font-size: 1.25rem; letter-spacing: 0.02em; }
    header p { margin: 6px 0 0; opacity: 0.9; font-size: 0.9rem; }
    #status { padding: 12px 20px; background: #fff; border-bottom: 1px solid #dde; font-size: 0.95rem; }
    #map { height: calc(100vh - 140px); min-height: 320px; }
    .err { color: #b00020; padding: 24px; }
    .pill { display: inline-block; background: rgba(255,255,255,0.2); padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; }
  </style>
</head>
<body>
  <header>
    <h1>SafeAlert</h1>
    <p>Suivi de trajet <span class="pill">lecture seule</span></p>
  </header>
  <div id="status">Chargement…</div>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (function () {
      const token = location.pathname.split("/").filter(Boolean).pop();
      const statusEl = document.getElementById("status");
      let map, marker, destMarker;

      function setStatus(html) { statusEl.innerHTML = html; }

      async function load() {
        try {
          const res = await fetch("/api/public/trips/" + encodeURIComponent(token));
          const data = await res.json();
          if (!res.ok) {
            setStatus('<span class="err">' + (data.error || "Lien invalide") + "</span>");
            return;
          }
          const t = data.trip;
          const lat = t.last_lat ?? t.origin_lat;
          const lng = t.last_lng ?? t.origin_lng;
          const eta = t.eta_at ? new Date(t.eta_at).toLocaleString("fr-FR") : "—";
          setStatus(
            "<strong>" + (t.traveler_pseudo || "Voyageur") + "</strong> · " +
            (t.dest_label || "Destination") +
            " · Statut : " + (t.status || "—") +
            " · Arrivée prévue : " + eta
          );

          if (!map) {
            map = L.map("map").setView([lat, lng], 14);
            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
              attribution: "&copy; OpenStreetMap",
            }).addTo(map);
            marker = L.marker([lat, lng]).addTo(map).bindPopup("Position actuelle");
            destMarker = L.marker([t.dest_lat, t.dest_lng], { title: "Destination" })
              .addTo(map).bindPopup(t.dest_label || "Destination");
            L.polyline([[t.origin_lat, t.origin_lng], [lat, lng], [t.dest_lat, t.dest_lng]], {
              color: "#0B6E6E", weight: 3, dashArray: "6 6",
            }).addTo(map);
          } else {
            marker.setLatLng([lat, lng]);
          }
        } catch (e) {
          setStatus('<span class="err">Impossible de charger le trajet.</span>');
        }
      }

      load();
      setInterval(load, 15000);
    })();
  </script>
</body>
</html>
